[package]
name = "gfx10"
description = "AMD GFX10.1 (gfx1013) shader decoder, disassembler and translator to Metal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLLibrary"] }
