[package]
name = "mkelf"
description = "Turns a linked FreeBSD x86-64 ELF into an Orbis executable, for our own test programs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ps5slop-mkelf"
path = "src/main.rs"

[dependencies]
loader = { path = "../loader" }
clap = { version = "4.5", features = ["derive"] }
