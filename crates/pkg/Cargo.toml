[package]
name = "pkg"
description = "Reads fake-signed PS4 packages and their PFS images"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ps5slop-pkg"
path = "src/main.rs"

[dependencies]
aes = "0.9"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hmac = "0.12"
sha2 = "0.10"
xts-mode = "0.6"
